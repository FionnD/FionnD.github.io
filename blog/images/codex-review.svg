<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">A code review exchange</title>
  <desc id="desc">Engineer asks why code bypasses the normal validation path. PM replies: Because Codex told me.</desc>
  <rect width="1100" height="520" rx="26" fill="#fcfcfc"/>
  <rect x="74" y="58" width="952" height="404" rx="18" fill="#ffffff" stroke="#e2e2e2" stroke-width="2"/>
  <rect x="74" y="58" width="952" height="54" rx="18" fill="#f2f2f2"/>
  <path d="M74 94h952" stroke="#e2e2e2" stroke-width="2"/>
  <circle cx="108" cy="85" r="8" fill="#c8c8c8"/>
  <circle cx="134" cy="85" r="8" fill="#c8c8c8"/>
  <circle cx="160" cy="85" r="8" fill="#c8c8c8"/>
  <text x="550" y="91" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#777777">pull request review</text>

  <rect x="126" y="150" width="610" height="120" rx="16" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
  <text x="160" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1" fill="#666666">ENGINEER</text>
  <text x="160" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="650" fill="#1f1f1f">Why does this bypass the normal validation path?</text>

  <rect x="364" y="300" width="610" height="120" rx="16" fill="#eff8f1" stroke="#cfe7d4" stroke-width="2"/>
  <text x="928" y="340" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1" fill="#4f7f58">PM</text>
  <text x="928" y="380" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="31" font-weight="700" fill="#1f1f1f">Because Codex told me.</text>

  <text x="550" y="454" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-style="italic" fill="#777777">Review requested: emotional damage</text>
</svg>
